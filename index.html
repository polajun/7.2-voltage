<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전류와 전기 에너지 확인 문제</title>
<style>
  :root {
    --bg: #f3f7f5;
    --card: #ffffff;
    --text: #1f2a26;
    --muted: #63736d;
    --line: #d9e4df;
    --accent: #1f8a6a;
    --ok: #1f8a4a;
    --ok-soft: #dcf3e4;
    --bad: #c23b3b;
    --bad-soft: #fbe2e2;
    --box: #f6f9f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a18;
      --card: #1d2523;
      --text: #e6eeeb;
      --muted: #9aaba5;
      --line: #33403c;
      --accent: #4cc39b;
      --ok: #5fd28c;
      --ok-soft: #1c3a28;
      --bad: #ef7b7b;
      --bad-soft: #3d2222;
      --box: #232d2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; flex: none; }
  header h1 { font-size: 1.3rem; margin: 0; }
  header .sub { color: var(--muted); font-size: 0.95rem; }
  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 14px; flex: none; }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }
  .card {
    flex: 1 1 auto; min-height: 0; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 1.4em 1.6em; box-shadow: 0 2px 10px rgba(0,0,0,.04); font-size: 20px;
  }
  .q { font-size: 1.3em; font-weight: 600; margin: 0 0 .8em; }
  .q .num { color: var(--accent); margin-right: 6px; }
  .bogi { border: 1px solid var(--line); background: var(--box); border-radius: 10px; padding: .7em 1em; margin-bottom: .9em; font-size: 1.05em; }
  .bogi .t { text-align: center; font-weight: 700; margin-bottom: .3em; }
  .bogi p { margin: .2em 0; }
  .tbl { border-collapse: collapse; margin: 0 auto .9em; font-size: 1em; }
  .tbl th, .tbl td { border: 1px solid var(--line); padding: .3em .9em; text-align: center; }
  .tbl th { background: var(--box); }
  .opts { display: grid; gap: .5em; }
  /* row: 보기 5개를 가로 한 줄로 (들어가지 않으면 세로 일렬) */
  .opts.row { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .opts.row .opt { white-space: nowrap; padding: .6em .7em; gap: .4em; }
  .opt {
    display: flex; gap: .7em; align-items: center; text-align: left;
    width: 100%; padding: .6em 1em; font: inherit; font-size: 1.1em; color: var(--text);
    background: var(--card); border: 2px solid var(--line); border-radius: 12px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt .n { font-weight: 700; min-width: 1.6em; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .sa { display: flex; gap: .5em; flex-wrap: wrap; }
  .sa input {
    flex: 1 1 260px; font: inherit; font-size: 1.1em; padding: .6em .9em; color: var(--text);
    background: var(--card); border: 2px solid var(--line); border-radius: 12px;
  }
  .sa input:focus { outline: none; border-color: var(--accent); }
  .btn {
    font: inherit; font-size: 1rem; font-weight: 700; padding: 12px 20px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--accent); background: var(--accent); color: #fff;
  }
  .card .btn { font-size: 1em; padding: .65em 1.1em; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .feedback { margin-top: .9em; padding: .8em 1em; border-radius: 12px; display: none; font-size: 1.05em; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--ok-soft); border: 1px solid var(--ok); }
  .feedback.bad { background: var(--bad-soft); border: 1px solid var(--bad); }
  .feedback.info { background: var(--box); border: 1px solid var(--line); }
  .feedback b.r { font-size: 1.1em; }
  .dot.res { width: auto; padding: 0 12px; border-radius: 99px; }
  .nav { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 14px; flex: none; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); color: var(--muted); font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; }
  .dot.cur { border-color: var(--accent); color: var(--accent); }
  .dot.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .dot.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
  .dot.retry { background: #e0952b; border-color: #e0952b; color: #fff; }
  .dot { display: inline-flex; align-items: center; justify-content: center; cursor: default; }
  .dot.todo { opacity: .35; }
  .lock { color: var(--muted); font-size: .9em; margin: .5em 0 0; }
  .result h2 { margin-top: 0; }
  .result .score { font-size: 2.6em; font-weight: 800; color: var(--accent); margin: .2em 0 .5em; }
  .result table { width: 100%; border-collapse: collapse; font-size: 1em; }
  .result th, .result td { border-bottom: 1px solid var(--line); padding: .35em .4em; text-align: left; }
  .hint { color: var(--muted); font-size: .85rem; text-align: center; margin: 8px 0 0; flex: none; }
  @media (max-width: 560px) {
    .card { padding: 1em; }
    .dot { width: 26px; height: 26px; font-size: .75rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>❷ 전류, 전압, 저항, 전기 에너지 확인 문제</h1>
    <span class="sub">Ⅶ. 전기와 자기 – 2. 전류와 전기 에너지</span>
  </header>
  <div class="progress"><div id="bar"></div></div>
  <div class="card" id="card"></div>
  <div class="nav">
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
const Q = [
  // 난이도 1
  { type: "mc",
    q: "전류의 세기를 나타내는 단위는?",
    opts: ["V(볼트)", "A(암페어)", "Ω(옴)", "W(와트)", "J(줄)"],
    ans: 1,
    exp: "전류의 단위는 A(암페어)이다. V는 전압, Ω은 저항, W는 소비 전력, J은 에너지의 단위이다." },
  { type: "mc",
    q: "저항이 작아서 전류가 잘 흐르는 물질(도체)은?",
    opts: ["고무", "플라스틱", "구리", "규소", "유리"],
    ans: 2,
    exp: "구리는 도체이다. 고무, 플라스틱, 유리는 부도체, 규소는 반도체이다." },
  { type: "sa",
    q: "여러 개의 저항을 전류가 하나의 길로 흐르도록 한 줄로 이어 연결하는 방법을 무엇이라고 하는지 쓰시오.",
    keys: [["직렬"]], display: "직렬연결",
    exp: "저항을 한 줄로 이어 전류가 하나의 길로 흐르도록 연결하는 방법을 직렬연결이라고 한다." },
  { type: "sa",
    q: "전기 기구가 1초 동안 사용한 전기 에너지의 양을 무엇이라고 하는지 쓰고, 그 단위를 순서대로 쓰시오.",
    keys: [["소비전력"], ["W", "w", "와트"]], ordered: true, display: "소비 전력, W(와트)",
    exp: "전기 기구가 1초 동안 사용한 전기 에너지의 양을 소비 전력이라고 하며, 단위로 W(와트)를 사용한다." },
  // 난이도 2
  { type: "mc",
    q: "저항의 병렬연결에 관한 설명으로 옳은 것은?",
    opts: ["전구를 많이 연결할수록 각 전구가 어두워진다.",
           "저항을 많이 연결할수록 전체 저항이 커진다.",
           "저항 하나를 빼면 회로 전체에 전류가 흐르지 않는다.",
           "각 저항에 전원과 같은 크기의 전압이 걸린다.",
           "퓨즈를 전기 기구에 연결할 때 이용하는 방법이다."],
    ans: 3,
    exp: "병렬연결에서는 각 저항이 전원에 각각 연결되어 같은 크기의 전압이 걸린다. ①, ③, ⑤는 직렬연결의 특징이고, 병렬연결은 전체 저항이 작아지므로 ②도 틀리다." },
  { type: "mc",
    q: "전기 기구와 주된 에너지 전환이 바르게 짝지어진 것은?",
    opts: ["배터리 충전: 전기 에너지 → 빛에너지",
           "스팀다리미: 전기 에너지 → 열에너지",
           "로봇 청소기: 전기 에너지 → 화학 에너지",
           "텔레비전: 전기 에너지 → 운동 에너지",
           "조명: 전기 에너지 → 소리 에너지"],
    ans: 1,
    exp: "배터리 충전은 화학 에너지, 로봇 청소기는 운동 에너지, 텔레비전은 빛에너지와 소리 에너지, 조명은 빛에너지로 전환한다." },
  { type: "sa",
    q: "빈칸 ㄱ, ㄴ에 알맞은 말을 순서대로 쓰시오.",
    box: ["전기 회로에 전류가 흐를 때, 전선 속 전자는 전지의 ( ㄱ )극에서 ( ㄴ )극 쪽으로 이동한다."],
    keys: [["-", "−", "－", "음"], ["+", "＋", "양"]], ordered: true, display: "ㄱ (-), ㄴ (+)",
    exp: "전자는 전지의 (-)극에서 (+)극 쪽으로 이동하고, 전류는 (+)극에서 (-)극 쪽으로 흐른다." },
  { type: "sa",
    q: "빈칸 ㄱ, ㄴ에 알맞은 말을 순서대로 쓰시오.",
    box: ["니크롬선의 저항은 길이가 길수록 ( ㄱ ), 굵기가 굵을수록 ( ㄴ )."],
    keys: [["커", "크", "증가", "늘어"], ["작아", "작", "감소", "줄어"]], ordered: true, display: "ㄱ 커지고, ㄴ 작아진다",
    exp: "니크롬선은 길이가 길수록 저항이 커지고, 굵기가 굵을수록 저항이 작아진다." },
  // 난이도 3
  { type: "mc",
    q: "물 흐름 모형과 전기 회로를 비교했을 때, 서로 대응하는 것끼리 바르게 짝지어진 것은?",
    opts: ["펌프 – 전구", "물레방아 – 전지", "밸브 – 전압", "물의 높이차 – 스위치", "물의 흐름 – 전류"],
    ans: 4,
    exp: "펌프는 전지, 물레방아는 전구, 밸브는 스위치, 물의 높이차는 전압, 물의 흐름은 전류에 대응한다." },
  { type: "mc",
    q: "다음 중 저항의 직렬연결을 이용한 예는?",
    opts: ["퓨즈", "멀티탭", "가정의 전기 배선", "건물의 전기 배선", "번갈아 켜지고 꺼지는 장식용 전구"],
    ans: 0,
    exp: "퓨즈는 직렬연결을 이용한다. 멀티탭, 가정과 건물의 전기 배선, 번갈아 켜지고 꺼지는 장식용 전구는 병렬연결을 이용한 예이다." },
  { type: "sa",
    q: "저항이 10 Ω인 니크롬선에 5 V의 전압을 걸었다. 이 니크롬선에 흐르는 전류의 세기는 몇 A인지 쓰시오.",
    keys: [["0.5"]], display: "0.5 A",
    exp: "전류의 세기 = 전압 ÷ 저항 = 5 V ÷ 10 Ω = 0.5 A" },
  { type: "sa",
    q: "소비 전력이 1200 W인 전기 주전자를 10초 동안 사용했다. 이때 소비한 전기 에너지는 몇 J인지 쓰시오.",
    keys: [["12000", "12,000"]], display: "12000 J",
    exp: "1200 W인 전기 주전자는 1초에 1200 J을 소비하므로, 10초 동안 1200 J × 10 = 12000 J을 소비한다." },
  // 난이도 4
  { type: "mc",
    q: "재질과 굵기가 같고 길이만 다른 니크롬선 A, B에 각각 전압을 걸고 전류의 세기를 측정하였다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
    table: [["니크롬선", "걸어 준 전압(V)", "흐른 전류(A)"], ["A", "6", "0.6"], ["B", "6", "0.3"]],
    bogi: ["ㄱ. A의 저항은 10 Ω이다.",
           "ㄴ. B의 저항은 A의 저항의 2배이다.",
           "ㄷ. B는 A보다 길이가 짧다."],
    opts: ["ㄱ, ㄴ", "ㄱ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
    ans: 0,
    exp: "A의 저항 = 6 V ÷ 0.6 A = 10 Ω, B의 저항 = 6 V ÷ 0.3 A = 20 Ω으로 B가 A의 2배이다(ㄱ ○, ㄴ ○). 굵기가 같을 때 길이가 길수록 저항이 크므로 B가 A보다 길다(ㄷ ×)." },
  { type: "mc",
    q: "표는 여러 전기 기구의 소비 전력을 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
    table: [["전기 기구", "LED 등", "선풍기", "텔레비전", "헤어드라이어"], ["소비 전력(W)", "10", "50", "100", "1500"]],
    bogi: ["ㄱ. 헤어드라이어는 1초 동안 1500 J의 전기 에너지를 소비한다.",
           "ㄴ. 텔레비전을 2초 동안 사용할 때와 선풍기를 2초 동안 사용할 때 소비하는 전기 에너지는 같다.",
           "ㄷ. 전기 에너지를 주로 열에너지로 전환하는 기구의 소비 전력이 빛에너지로 전환하는 기구보다 크다."],
    opts: ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"],
    ans: 3,
    exp: "ㄱ ○: 1500 W는 1초에 1500 J을 소비한다는 뜻이다. ㄴ ×: 2초 동안 텔레비전은 200 J, 선풍기는 100 J을 소비한다. ㄷ ○: 열에너지로 전환하는 헤어드라이어(1500 W)가 빛에너지로 전환하는 LED 등이나 텔레비전보다 소비 전력이 크다." },
  { type: "sa",
    q: "어떤 전기 회로의 전선 속에서 전자가 A 지점에서 B 지점 쪽으로 이동하고 있다. ① 이 전선에서 전류의 방향(예: ○→○)과 ② 전자가 띠는 전하의 종류를 순서대로 쓰시오.",
    keys: [["B→A", "B->A", "B에서A", "b→a", "b->a", "b에서a"], ["-", "−", "－", "음"]], ordered: true, display: "① B → A, ② (-)전하",
    exp: "전자는 (-)전하를 띠기 때문에 전류의 방향은 전자의 이동 방향과 반대이다. 따라서 전류는 B에서 A 쪽으로 흐른다." },
  { type: "sa",
    q: "같은 전구 3개를 (가)는 직렬로, (나)는 병렬로 같은 전지에 연결하였다. 다음에 해당하는 회로를 (가), (나) 중에서 골라 순서대로 쓰시오.",
    box: ["① 전구 1개의 밝기가 더 밝은 회로", "② 전구 1개를 빼면 나머지 전구가 모두 꺼지는 회로"],
    keys: [["나"], ["가"]], ordered: true, display: "① (나), ② (가)",
    exp: "병렬연결(나)은 각 전구에 전구 1개를 연결할 때와 같은 전압이 걸려 더 밝다. 직렬연결(가)은 전류가 하나의 길로 흐르므로 전구 하나를 빼면 회로 전체에 전류가 흐르지 않는다." },
  // 난이도 5
  { type: "mc",
    q: "물 흐름 모형과 전기 회로에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
    bogi: ["ㄱ. 회로에서 전지를 빼면 전선 속 전자가 한 방향으로 이동하지 않는다.",
           "ㄴ. 펌프가 물의 높이차를 유지하는 것처럼, 전지는 전압을 유지하여 전류가 계속 흐르게 한다.",
           "ㄷ. 밸브를 잠그면 물레방아가 멈추는 것은 스위치를 열면(끄면) 전구의 불이 꺼지는 것에 해당한다.",
           "ㄹ. 전선 속에서 전류의 방향과 전자의 이동 방향은 같다."],
    opts: ["ㄱ, ㄴ", "ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ"],
    ans: 3,
    exp: "ㄱ, ㄴ, ㄷ은 옳다. 전압이 있어야 전자가 한 방향으로 이동하고, 펌프는 전지, 밸브는 스위치에 대응한다. ㄹ ×: 전류의 방향과 전자의 이동 방향은 반대이다." },
  { type: "mc",
    q: "표는 성능이 같은 전기난로 A, B의 정보이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?",
    table: [["전기난로", "소비 전력(W)", "에너지 소비 효율 등급"], ["A", "2000", "3등급"], ["B", "1500", "1등급"]],
    bogi: ["ㄱ. B를 4초 동안 사용할 때 소비하는 전기 에너지는 A를 3초 동안 사용할 때와 같다.",
           "ㄴ. 같은 시간 동안 사용하면 B가 소비하는 전기 에너지가 더 적다.",
           "ㄷ. A와 B는 모두 전기 에너지를 주로 열에너지로 전환한다.",
           "ㄹ. 전기 에너지를 효율적으로 사용하려면 A를 선택하는 것이 좋다."],
    opts: ["ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"],
    ans: 2,
    exp: "ㄱ ○: B는 1500 J × 4 = 6000 J, A는 2000 J × 3 = 6000 J로 같다. ㄴ ○, ㄷ ○. ㄹ ×: 성능이 같다면 소비 전력이 작고 에너지 소비 효율 등급이 높은 B를 선택한다." },
  { type: "sa",
    q: "어떤 니크롬선 X에 3 V의 전압을 걸었더니 0.2 A의 전류가 흘렀다. (단, 니크롬선의 저항은 길이에 비례한다.) ①, ②의 값을 순서대로 쓰시오.",
    box: ["① 니크롬선 X의 저항(Ω)",
          "② X와 재질·굵기가 같고 길이가 2배인 니크롬선에 6 V의 전압을 걸 때 흐르는 전류의 세기(A)"],
    keys: [["15"], ["0.2"]], ordered: true, display: "① 15 Ω, ② 0.2 A",
    exp: "① 저항 = 3 V ÷ 0.2 A = 15 Ω. ② 길이가 2배이면 저항도 2배인 30 Ω이므로, 전류 = 6 V ÷ 30 Ω = 0.2 A이다." },
  { type: "sa",
    q: "가정에서 냉장고, 텔레비전, 전등을 함께 사용하고 있다. 빈칸 ㄱ~ㄹ에 알맞은 말을 순서대로 쓰시오.",
    box: ["가정의 전기 기구들은 서로 ( ㄱ )로 연결되어 있다.",
          "텔레비전을 끄면 냉장고에 흐르는 전류의 세기는 ( ㄴ ).",
          "동시에 켜 둔 전기 기구가 많아질수록 집 전체의 저항은 ( ㄷ ), 전체 전류의 세기는 ( ㄹ )."],
    keys: [["병렬"], ["변하지않", "변함없", "변함이없", "그대로", "같"], ["작아", "작", "감소", "줄어"], ["커", "크", "증가", "늘어"]], ordered: true,
    display: "ㄱ 병렬연결, ㄴ 변하지 않는다, ㄷ 작아지고, ㄹ 커진다",
    exp: "가정의 전기 배선은 병렬연결이라 각 기구에 같은 전압이 걸리므로, 다른 기구를 꺼도 냉장고의 전류는 변하지 않는다. 병렬로 연결된 기구가 많아질수록 전체 저항은 작아지고 전체 전류는 커진다." }
];

const NUM = ["①", "②", "③", "④", "⑤"];
// solved: 정답을 맞혔는지, wrong: 틀린 횟수, picks: 객관식에서 틀리게 고른 보기, last: 방금 틀렸는지
const freshState = () => ({ solved: false, wrong: 0, picks: [], text: "", last: null });
let state = Q.map(freshState);
let cur = 0;

// 진행 상황을 브라우저에 저장해서 새로고침해도 이어서 풀도록 함
// (교사용 초기화: 주소 끝에 ?reset 을 붙여 열면 처음부터 다시 시작)
const SAVE_KEY = "quiz-7-2-current";
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ cur, state })); } catch (e) {}
}
function load() {
  try {
    if (new URLSearchParams(location.search).has("reset")) {
      localStorage.removeItem(SAVE_KEY);
      history.replaceState(null, "", location.pathname);
      return;
    }
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d && Array.isArray(d.state) && d.state.length === Q.length) {
      state = d.state.map(s => Object.assign(freshState(), s));
      cur = Math.min(Math.max(0, d.cur | 0), Q.length);
    }
  } catch (e) {}
}
load();

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const norm = s => s.replace(/\s+/g, "");

function checkSA(q, text) {
  const t = norm(text);
  if (!t.length) return false;
  if (!q.ordered) return q.keys.every(alts => alts.some(k => t.includes(norm(k))));
  // ordered: 답이 여러 개일 때 ①, ② 순서대로 썼는지 확인
  let p = 0;
  for (const alts of q.keys) {
    const hits = alts.map(k => t.indexOf(norm(k), p)).filter(i => i >= 0);
    if (!hits.length) return false;
    p = Math.min(...hits) + 1;
  }
  return true;
}

function render() {
  save();
  $("bar").style.width = ((cur + 1) / (Q.length + 1) * 100) + "%";
  renderDots();

  if (cur === Q.length) return renderResult();

  const q = Q[cur], s = state[cur];
  const done = s.solved;
  let html = `<p class="q"><span class="num">${cur + 1}.</span>${esc(q.q)}</p>`;

  if (q.table) {
    const [head, ...rows] = q.table;
    html += `<table class="tbl"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  // box: 제목 없는 상자 (빈칸 문장, 소문항 등)
  if (q.box) {
    html += `<div class="bogi">${q.box.map(b => `<p>${esc(b)}</p>`).join("")}</div>`;
  }
  if (q.bogi) {
    html += `<div class="bogi"><div class="t">&lt;보기&gt;</div>${q.bogi.map(b => `<p>${esc(b)}</p>`).join("")}</div>`;
  }

  if (q.type === "mc") {
    html += `<div class="opts" id="opts">${q.opts.map((o, i) => {
      let cls = "opt";
      if (done && i === q.ans) cls += " correct";
      else if (s.picks.includes(i)) cls += " wrong";
      const off = done || s.picks.includes(i);
      return `<button class="${cls}" data-i="${i}" ${off ? "disabled" : ""}><span class="n">${NUM[i]}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>`;
  } else {
    html += `<div class="sa">
        <input id="ans" type="text" placeholder="정답을 입력하세요" value="${esc(s.text)}" ${done ? "disabled" : ""} autocomplete="off">
        <button class="btn" id="check" ${done ? "disabled" : ""}>제출</button>
      </div>`;
  }

  html += `<div class="feedback" id="fb"></div>`;
  if (!done) html += `<p class="lock">🔒 정답을 맞혀야 다음 문제로 넘어갈 수 있어요.</p>`;
  $("card").innerHTML = html;

  if (q.type === "mc") {
    document.querySelectorAll(".opt:not(:disabled)").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (i === q.ans) { s.solved = true; s.last = "ok"; }
      else { s.picks.push(i); s.wrong++; s.last = "bad"; }
      render();
    });
  } else if (!done) {
    const inp = $("ans");
    inp.oninput = () => s.text = inp.value;
    inp.onkeydown = e => { if (e.key === "Enter") { e.stopPropagation(); $("check").click(); } };
    $("check").onclick = () => {
      if (!norm(inp.value)) { inp.focus(); return; }
      s.text = inp.value;
      if (checkSA(q, s.text)) { s.solved = true; s.last = "ok"; }
      else { s.wrong++; s.last = "bad"; }
      render();
    };
    inp.focus();
    if (s.last === "bad") inp.select();
  }

  if (s.last) showFeedback(q, s);
  fit();
}

function showFeedback(q, s) {
  const fb = $("fb");
  if (s.solved) {
    const answer = q.type === "mc" ? `${NUM[q.ans]} ${esc(q.opts[q.ans])}` : esc(q.display);
    fb.className = "feedback show ok";
    const label = cur === Q.length - 1 ? "결과 보기 ▶" : "다음 문제 ▶";
    fb.innerHTML = `<b class="r">⭕ 정답입니다!</b><br>정답: <b>${answer}</b><br>해설: ${esc(q.exp)}
      <div style="text-align:right;margin-top:.6em"><button class="btn" id="go">${label}</button></div>`;
    $("go").onclick = () => { cur++; render(); };
  } else {
    fb.className = "feedback show bad";
    fb.innerHTML = `<b class="r">❌ 틀렸어요. 다시 풀어 보세요.</b>`;
  }
}

// 진행 상황 표시용 (눌러서 이동할 수 없음 – 앞으로는 '다음 문제' 버튼으로만 이동)
function renderDots() {
  $("dots").innerHTML = Q.map((_, i) => {
    const s = state[i];
    let cls = "dot";
    if (s.solved) cls += s.wrong === 0 ? " ok" : " retry";
    else if (s.wrong > 0) cls += " bad";
    if (i === cur) cls += " cur";
    if (i > cur) cls += " todo";
    return `<span class="${cls}">${i + 1}</span>`;
  }).join("") + `<span class="dot res${cur === Q.length ? " cur" : " todo"}">결과</span>`;
}

function renderResult() {
  const ok = state.filter(s => s.wrong === 0).length;
  const rows = Q.map((q, i) => {
    const w = state[i].wrong;
    const mark = w === 0 ? "⭕ 한 번에 맞힘" : `🔁 ${w}번 틀린 뒤 맞힘`;
    const ans = q.type === "mc" ? NUM[q.ans] : q.display;
    return `<tr><td>${i + 1}</td><td>${esc(ans)}</td><td>${mark}</td></tr>`;
  }).join("");
  $("card").innerHTML = `<div class="result">
      <h2>결과 <small style="font-size:.55em;color:var(--muted);font-weight:500">한 번에 맞힌 문제 수</small></h2>
      <div class="score">${ok} / ${Q.length}</div>
      <table><thead><tr><th>번호</th><th>정답</th><th>결과</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  fit();
}

// 카드 안의 내용이 스크롤 없이 한 화면에 모두 보이도록 글자 크기를 자동으로 맞춤
// row: 객관식 보기를 가로 한 줄로 배치 (보기 글자가 버튼에서 잘리면 안 됨)
function shrink(row) {
  const c = $("card"), o = $("opts");
  if (o) o.classList.toggle("row", row);
  const cut = () => row && [...o.children].some(b => b.scrollWidth > b.clientWidth);
  let fs = window.innerWidth < 560 ? 17 : 22;
  c.style.fontSize = fs + "px";
  while ((c.scrollHeight > c.clientHeight || cut()) && fs > 10) {
    fs -= 0.5;
    c.style.fontSize = fs + "px";
  }
  return cut() ? 0 : fs;
}

// 객관식 보기는 가로 한 줄 / 세로 일렬 중 글자를 더 크게 보여 줄 수 있는 쪽으로 배치
function fit() {
  if (!$("opts")) return shrink(false);
  const rowFs = shrink(true);
  const colFs = shrink(false);
  if (rowFs >= colFs) shrink(true);
}
window.addEventListener("resize", fit);

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  // 정답을 맞힌 뒤 Enter를 한 번 더 누르면 다음 문제로 (제출할 때 누른 Enter와는 별개)
  if (e.key === "Enter" && !e.repeat && $("go")) { e.preventDefault(); $("go").click(); }
});

render();
</script>
</body>
</html>
